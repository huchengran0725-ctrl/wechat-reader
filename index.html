<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f7f6f3">
<title>我的公众号阅读卡片</title>
<style>
  :root{
    --bg:#f7f6f3; --card:#ffffff; --ink:#1a1a1a; --sub:#6b6b6b;
    --line:#ececec; --accent:#c0392b; --tag:#f0efe9; --shadow:0 1px 3px rgba(0,0,0,.05);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.6; padding-bottom:40px; -webkit-font-smoothing:antialiased;
  }
  header{
    position:sticky; top:0; z-index:10; background:rgba(247,246,243,.92);
    backdrop-filter:saturate(180%) blur(12px); border-bottom:1px solid var(--line);
    padding:14px 18px;
  }
  .h-row{display:flex; align-items:center; gap:12px;}
  .back{
    font-size:15px; color:var(--accent); background:none; border:none; cursor:pointer;
    padding:0; display:none; font-weight:500;
  }
  h1{font-size:19px; margin:0; font-weight:600; letter-spacing:.5px;}
  .meta{font-size:12px; color:var(--sub); margin-top:3px;}
  .filters{display:flex; gap:8px; overflow-x:auto; padding:12px 18px 4px; scrollbar-width:none;}
  .filters::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto; font-size:13px; padding:6px 14px; border-radius:20px;
    background:var(--tag); color:var(--sub); border:none; cursor:pointer; white-space:nowrap; transition:all .15s;
  }
  .chip.active{background:var(--ink); color:#fff;}
  .wrap{max-width:640px; margin:0 auto; padding:8px 14px;}
  .day-label{font-size:13px; color:var(--sub); font-weight:600; margin:20px 6px 8px;}

  /* 首页文章卡 */
  .art-card{
    background:var(--card); border-radius:14px; box-shadow:var(--shadow);
    margin-bottom:12px; border:1px solid var(--line); padding:16px 18px; cursor:pointer;
    transition:transform .12s;
  }
  .art-card:active{transform:scale(.985);}
  .art-account{font-size:12px; color:var(--accent); font-weight:600; margin-bottom:6px;}
  .art-title{font-size:16px; font-weight:600; line-height:1.45; margin:0 0 8px;}
  .art-oneline{font-size:13px; color:var(--sub); margin:0 0 12px;}
  .art-foot{font-size:12px; color:#a0a0a0; display:flex; justify-content:space-between; align-items:center;}
  .art-foot .go{color:var(--accent); font-weight:500;}

  /* 详情页章节卡 */
  .detail-head{padding:6px 4px 2px;}
  .detail-account{font-size:13px; color:var(--accent); font-weight:600;}
  .detail-title{font-size:21px; font-weight:600; line-height:1.4; margin:8px 0 6px;}
  .detail-meta{font-size:12px; color:var(--sub); margin-bottom:4px;}
  .detail-oneline{
    font-size:14px; color:#333; background:#fbf3f2; border-left:3px solid var(--accent);
    padding:12px 14px; border-radius:0 10px 10px 0; margin:14px 0 22px;
  }
  .sec-card{
    background:var(--card); border-radius:14px; box-shadow:var(--shadow);
    border:1px solid var(--line); padding:18px 20px; margin-bottom:14px;
  }
  .sec-index{
    display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px;
    background:var(--accent); color:#fff; border-radius:50%; font-size:12px; font-weight:600; margin-right:8px;
  }
  .sec-heading{font-size:16px; font-weight:600; margin:0 0 10px; display:flex; align-items:center; line-height:1.4;}
  .sec-content{font-size:14.5px; color:#333; margin:0; line-height:1.75;}
  .read-origin{
    display:block; text-align:center; font-size:14px; font-weight:500; color:#fff;
    background:var(--accent); padding:13px; border-radius:12px; text-decoration:none; margin-top:20px;
  }
  .empty{text-align:center; color:var(--sub); padding:60px 20px; font-size:14px;}
  footer{text-align:center; font-size:11px; color:#b0b0b0; margin-top:30px;}
</style>
</head>
<body>
<header>
  <div class="h-row">
    <button class="back" id="back">‹ 返回</button>
    <div>
      <h1 id="h-title">公众号阅读卡片</h1>
      <div class="meta" id="meta">加载中…</div>
    </div>
  </div>
</header>
<div class="filters" id="filters"></div>
<div class="wrap" id="app"></div>
<footer id="footer"></footer>

<script>
let DATA = {articles:[]};
let currentFilter = "全部";

async function load(){
  try{
    const res = await fetch("articles.json?_t=" + Date.now());
    DATA = await res.json();
  }catch(e){
    document.getElementById("app").innerHTML = '<div class="empty">还没有数据，等自动化跑起来就有了 📭</div>';
    return;
  }
  document.getElementById("footer").textContent = "每天自动更新 · 碎片化阅读";
  route();
}

window.addEventListener("hashchange", route);

function route(){
  const hash = location.hash.replace(/^#\/?/, "");
  if(hash && hash !== ""){
    const art = DATA.articles.find(a=>a.id===hash);
    if(art){ renderDetail(art); return; }
  }
  renderHome();
}

function renderHome(){
  document.getElementById("back").style.display = "none";
  document.getElementById("h-title").textContent = "公众号阅读卡片";
  document.getElementById("meta").textContent = "共 " + DATA.articles.length + " 篇 · 更新于 " + (DATA.updated_at||"");
  renderFilters();

  const app = document.getElementById("app");
  let items = DATA.articles.slice();
  if(currentFilter !== "全部") items = items.filter(a=>a.account===currentFilter);
  items.sort((a,b)=>(b.date||"").localeCompare(a.date||""));

  if(items.length===0){ app.innerHTML = '<div class="empty">这个分类下还没有文章</div>'; return; }

  let html="", lastDate="";
  items.forEach(a=>{
    if(a.date!==lastDate){ html += '<div class="day-label">'+fmtDate(a.date)+'</div>'; lastDate=a.date; }
    const n = (a.sections||[]).length;
    html += `
    <div class="art-card" onclick="location.hash='#/${a.id}'">
      <div class="art-account">${esc(a.account)}</div>
      <h2 class="art-title">${esc(a.title)}</h2>
      <p class="art-oneline">${esc(a.one_line||"")}</p>
      <div class="art-foot">
        <span>${n} 张卡片 · 约 ${a.read_minutes||"?"} 分钟</span>
        <span class="go">阅读 ›</span>
      </div>
    </div>`;
  });
  app.innerHTML = html;
}

function renderDetail(a){
  document.getElementById("filters").innerHTML = "";
  document.getElementById("back").style.display = "block";
  document.getElementById("back").onclick = ()=>{ location.hash = ""; };
  document.getElementById("h-title").textContent = esc(a.account);
  document.getElementById("meta").textContent = fmtDate(a.date) + " · 约 " + (a.read_minutes||"?") + " 分钟";
  window.scrollTo(0,0);

  const secs = (a.sections||[]).map((s,i)=>`
    <div class="sec-card">
      <h3 class="sec-heading"><span class="sec-index">${i+1}</span>${esc(s.heading)}</h3>
      <p class="sec-content">${esc(s.content)}</p>
    </div>`).join("");

  document.getElementById("app").innerHTML = `
    <div class="detail-head">
      <div class="detail-account">${esc(a.account)}</div>
      <h2 class="detail-title">${esc(a.title)}</h2>
    </div>
    ${a.one_line ? '<div class="detail-oneline">'+esc(a.one_line)+'</div>' : ''}
    ${secs}
    <a class="read-origin" href="${esc(a.url)}" target="_blank" rel="noopener">阅读原文 →</a>`;
}

function renderFilters(){
  const accounts = ["全部", ...new Set(DATA.articles.map(a=>a.account))];
  const box = document.getElementById("filters");
  box.innerHTML = "";
  accounts.forEach(name=>{
    const b = document.createElement("button");
    b.className = "chip" + (name===currentFilter ? " active":"");
    b.textContent = name;
    b.onclick = ()=>{ currentFilter=name; renderHome(); };
    box.appendChild(b);
  });
}

function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function fmtDate(d){
  if(!d) return "";
  const today = new Date().toISOString().slice(0,10);
  if(d===today) return "今天";
  return d.replace(/-/g,".");
}
load();
</script>
</body>
</html>
